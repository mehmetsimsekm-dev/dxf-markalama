<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DXF Markalama</title><style>body{font:16px system-ui;background:#111827;color:#eee;max-width:1000px;margin:auto;padding:20px}button,input,select{font:inherit;padding:9px;margin:5px;border-radius:7px}button{cursor:pointer}svg{width:100%;height:400px;background:#202b39;touch-action:none}section{background:#253246;padding:12px;border-radius:10px;margin:12px 0}label{display:inline-block}#list{max-height:230px;overflow:auto}#list button{display:block;text-align:left;width:95%}</style><h1>DXF Otomatik Markalama V2.7 Beta</h1><p>Dosyalar cihazınızda işlenir. Büküm uçlarında R1 çentik. Üretim öncesi kontrol zorunludur.</p><section><label>DXF seç <input id="files" type="file" multiple accept=".dxf"></label><label>Klasör seç <input id="folder" type="file" webkitdirectory multiple></label><p id="folderInfo"></p><label>Yükseklik mm <input id="h" type="number" min="1" value="10" style="width:65px"></label><label><input id="autoSize" type="checkbox" checked> Otomatik küçült</label><label>Minimum mm <input id="minH" type="number" min="1" value="6" style="width:65px"></label><label>Boşluk mm <input id="m" type="number" min="0" value="3" style="width:65px"></label><label><input type="checkbox" id="confirmBends" checked> Büküm çizgisi adaylarının kaldırılmasını onaylıyorum</label><label><input type="checkbox" id="notches" checked> R1 çentik</label><label><input type="checkbox" id="markText" checked> İsim markalama</label><button id="run">Markala</button><button id="zip">ZIP indir</button></section><div id="status"></div><div id="list"></div><section><label>Parça adı <input id="name"></label><button id="rotate">90° döndür</button><button id="save">Seçili DXF indir</button><p>Yazıyı taşımak için önizlemede hedef noktaya dokunun.</p><svg id="view"></svg></section><script src="app.js?v=27"></script></html>
